<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      {%- comment -%} minima の default.html に、front matter の `wide: true` で本文を広げる指定を足したもの {%- endcomment %}
      <div class="wrapper{% if page.wide %} wrapper-wide{% endif %}">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
