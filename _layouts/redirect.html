<!DOCTYPE html>
{%- comment -%} 廃止したページの URL から、移転先 (page.redirect_to) へ転送する {%- endcomment %}
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ site.title | escape }}</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <script>location.replace({{ page.redirect_to | relative_url | jsonify }} + location.hash);</script>
</head>
<body>
  <p><a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | relative_url }}</a></p>
</body>
</html>
