name: Update TF-IDF word cloud and Language Globe

on:
  push:
    branches: [main]
    paths:
      - "_data/home/**"
      - "scripts/generate_wordcloud.py"
      - "scripts/generate_language_globe.py"
      - "scripts/language_globe_lexicon.yml"
      - "_data/products.yml"
      - "requirements-wordcloud.txt"
      - ".github/workflows/update-wordcloud.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wordcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-wordcloud.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --requirement requirements-wordcloud.txt

      - name: Download LINE Seed JP
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/LINESeedJP-Bold.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/lineseedjp/LINESeedJP-Bold.ttf

      - name: Test corpus extraction and weighting
        run: python -m unittest discover -s tests

      - name: Generate the word cloud
        run: python scripts/generate_wordcloud.py --font /tmp/LINESeedJP-Bold.ttf

      - name: Generate the Language Globe data
        run: python scripts/generate_language_globe.py

      - name: Commit the updated image and data
        run: |
          if git diff --quiet -- assets/images/wordcloud/tfidf-wordcloud.png _data/language_globe.json; then
            echo "The generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/wordcloud/tfidf-wordcloud.png _data/language_globe.json
          git commit -m "chore: update TF-IDF word cloud and Language Globe"
          git push
