name: Deploy Pages with fresh OSS metadata

on:
  push:
    branches: [main]
  schedule:
    # Odd-numbered days at 03:17 UTC (12:17 JST).
    # Month-end gap: 24h for 31-day months / leap February; otherwise 48h.
    - cron: "17 3 1-31/2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-oss.txt
      - name: Install OSS dependencies
        run: python -m pip install --requirement requirements-oss.txt
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Test OSS refresh and deployment contract (offline)
        env:
          OSS_TEST_JEKYLL: "1"
        run: python -m unittest discover -s tests -p 'test_update_oss.py'
      - name: Refresh all OSS metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_oss.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
