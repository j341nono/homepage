# ==================================================
# Cosmos（クロスメディアバー風 UI）のカテゴリ設定
# ==================================================
# categories: セクションの id ごとのアクセント色とアイコン（_includes/cosmos-icon.html の名前）
#             選んだカテゴリの色が背景の波と光に使われる
# fallback:   categories に無い活動セクションへ順番に割り当てる色（アイコンは spark）
# 新しい活動セクションは、ここに書かなくても自動でカテゴリとして並ぶ。
categories:
  profile:      { accent: "#5aa9ff", icon: profile }
  research:     { accent: "#8b7bff", icon: research }
  publications: { accent: "#3fc8b8", icon: book }
  hackathons:   { accent: "#ff7a59", icon: code }
  oss:          { accent: "#47c26b", icon: branch }
  events:       { accent: "#f2b84b", icon: mic }
  internships:  { accent: "#4f8cff", icon: briefcase }
  organizing:   { accent: "#e86fb4", icon: people }
  achievements: { accent: "#e8c45a", icon: medal }
  products:     { accent: "#a07bff", icon: cube }
  site:         { accent: "#8fa3c4", icon: gear }
fallback:
  - "#6aa7ff"
  - "#a58bff"
  - "#45c9c1"
  - "#ff8f6b"
  - "#e978b8"
  - "#7bd389"
