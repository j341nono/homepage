# ==================================================
# 研究業績より下のセクション（ハッカソン・インターンなど）
# ==================================================
# ここに書いた順にセクションが並び、items は上から順に表示される。
# grouped: true のセクションでは、category ごとに小見出しを付ける。
# セクションを増やすときは `- title:` と `items:` を足すだけでよい。
#
# 各項目（title 以外は省略可。省略した項目は表示されない）
#   title:       名前（イベント名・会社名・賞の名前など）
#   role:        職種・立場（例: ML Engineer）。period の前に「｜」区切りで表示
#   period:      時期（例: 2026年9月、2026年8月〜9月（6週間））
#   description: 内容
#   award:       受賞（赤字で表示）
#   links:       [{ label: Link, url: ... }, { label: Code, url: ... }]
#   stats:       順位・賞金などのバッジ（例: - 順位：1 / 14）
#
# ※ ": "（コロン＋スペース）や " #" を含む文は "..." で囲む
# ※ 一時的に隠したい項目は、行頭に # を付けてコメントアウトする

