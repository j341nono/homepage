# ==================================================
# Engineering ページに載せるプロジェクト
# ==================================================
# ※ 現在の4件はすべてダミーです（イベント名・受賞・URL は架空）。
#    書き方の見本として、パターンの異なる4件を置いています。
#      1. ハッカソン作品（イベント・受賞・GitHub・スライド・記事・画像複数）
#      2. 個人開発（受賞にリンクあり・デモ公開）
#      3. インターンや授業での制作（イベントのみ・記事リンクのみ）
#      4. 最小構成（必須項目＋よく使う項目のみ）
#
# 項目（title と screenshots 以外は省略可。省略した項目は表示されない）
#   title:        作品名
#   period:       制作時期（例: 2026年9月、2026年4月〜現在）
#   role:         体制と担当範囲（例: チーム開発（4人）／バックエンド担当）
#   description:  概要（1〜2文）
#   event:        何で作ったか（ハッカソン名・インターン先など）
#                   event:
#                     name: HACK SONIC 2026 秋
#                     url: https://...          # 省略可
#                 リンク不要なら `event: 個人開発` のように1行でも書ける
#   achievements: 受賞など。文字列だけでも、リンク付きでもよい
#                   achievements:
#                     - 11チーム中2位
#                     - label: 企業賞
#                       url: https://...
#   tags:         使用技術。書いた表記のまま表示される（Next.js, gRPC など）
#   links:        関連リンク。label は自由（GitHub / デモ / スライド / 解説記事 など）
#                   links:
#                     - label: GitHub
#                       url: https://github.com/...
#   screenshots:  画像。2枚以上でカルーセルになる（左右の矢印・スワイプで切り替え）
#                   - src:      画像のパス
#                     alt:      代替テキスト（何が写っているか）
#                     width / height: 画像の実寸（レイアウトずれ防止用）

# --------------------------------------------------
# 1. ハッカソン作品（全項目を使う例）
# --------------------------------------------------

- title: ブクスペ
  period: 2026年9月
  role: 個人開発
  description: ブックマークを宇宙空間に浮かぶ星に変え、銀河を眺めたり星座を作ったりしながら目的のページを探せるブラウザ拡張機能。現在、ストアでの公開に向けて審査中です。
  event:
    name: HACK SONIC 2026 秋
    url: https://www.dhw.co.jp/press-release/20260819_hacksonic5/
  achievements:
    - 2位（11チーム中）
  tags:
    - TypeScript
    - Three.js
    - Transformers.js
    - WebAssembly
    - IndexedDB
  links:
    - label: GitHub
      url: https://github.com/j341nono/bukusupe
    - label: スライド
      url: https://speakerdeck.com/j341nono/bukku-maku-o-uchuu-kuukan-no-hoshi-toshite-tansaku-suru-chrome-kakuchou-kinou-hack-sonic-2026
    - label: デモ
      url: https://j341nono.github.io/bukusupe/
  screenshots:
    - src: /assets/images/engineering/bukusupe/1.png
      alt: ブクスペのタイトル画像。星空を背景にロゴと画面例が並ぶ
      width: 1376
      height: 774
    - src: /assets/images/engineering/bukusupe/2.png
      alt: ブックマークがカテゴリごとの星団として夜空に並んだ画面
      width: 1280
      height: 800
    - src: /assets/images/engineering/bukusupe/3.png
      alt: 「夜空を眺めたい」と検索し、関連するブックマークがブラックホールの周りに集まった画面
      width: 1280
      height: 800
    - src: /assets/images/engineering/bukusupe/4.png
      alt: 選んだブックマークの星を線で結び、星座「夜空の記録」を作った画面
      width: 1280
      height: 800
    - src: /assets/images/engineering/bukusupe/5.png
      alt: 宇宙船を操縦してブックマークの星の間を飛行する画面
      width: 1280
      height: 800
    - src: /assets/images/engineering/bukusupe/6.png
      alt: Chrome 拡張機能・Web Worker 上の埋め込みモデル・IndexedDB などからなるシステム構成図
      width: 1376
      height: 774

