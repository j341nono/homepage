# ==================================================
# Products ページに載せるプロダクト
# ==================================================
# 上から順にカードとして並ぶ（新しいものを上に書く）。
#
# 項目（title・period・image 以外は省略可。省略した項目は表示されない）
#   title:        作品名
#   period:       制作時期（例: 2026年9月、2026年4月〜現在）
#                 先頭4桁を西暦として、ページ上部の「2025 — 2026」のような期間表示に使う
#   role:         体制（例: 個人開発、チーム開発）
#   description:  概要（1〜2文）
#   event:        何で作ったか（ハッカソン名・インターン先など）
#                   event:
#                     name: HACK SONIC 2026 秋
#                     url: https://...          # 省略可
#                 リンク不要なら `event: 個人開発` のように1行でも書ける
#   achievements: 受賞など。文字列だけでも、リンク付きでもよい
#                   achievements:
#                     - 11チーム中2位
#                     - label: 企業賞
#                       url: https://...
#   categories:   絞り込み用のカテゴリ（複数可）。書いたカテゴリがそのままフィルタのボタンになる
#                 表記ゆれに注意（例: AI, Web, Browser Extension, Mobile, Desktop, Hackathon）
#   tags:         使用技術。書いた表記のまま表示される（Next.js, gRPC など）
#   links:        関連リンク。label は自由（GitHub / デモ / スライド / 解説記事 など）
#                   links:
#                     - label: GitHub
#                       url: https://github.com/...
#   image:        カード上部のサムネイル（1枚）。16:9 に切り抜いて表示される
#                   image:
#                     src:    画像のパス
#                     alt:    代替テキスト（何が写っているか）
#                     width / height: 画像の実寸（レイアウトずれ防止用）

