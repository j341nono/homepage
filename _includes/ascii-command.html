{%- comment -%} ASCII モードのセクション見出し。番号付きの見出しと罫線でシンプルに構成する {%- endcomment -%}
<header class="ascii-section-head">
  <h2 class="ascii-heading" id="{{ include.id | escape }}">
    <span class="ascii-heading-index" aria-hidden="true">{{ include.index }}</span>
    <span class="ascii-heading-text" data-ascii-scramble>{{ include.title | escape }}</span>
    {%- if include.count %}
    <span class="ascii-heading-count" aria-hidden="true">{{ include.count }}</span>
    {%- endif %}
  </h2>
</header>
