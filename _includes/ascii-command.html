{%- comment -%} ASCII モードのセクション見出し。プロンプト行（コマンド）と、番号付きの見出しを並べる {%- endcomment -%}
<header class="ascii-section-head">
  <p class="ascii-command" aria-hidden="true"><span class="ascii-user">nonomura@ehime</span><span class="ascii-dim">:</span><span class="ascii-path">~</span><span class="ascii-dim">$</span> <span data-ascii-type>{{ include.command | escape }}</span></p>
  <h2 class="ascii-heading" id="{{ include.id | escape }}"><span class="ascii-heading-index" aria-hidden="true">{{ include.index }}</span><span data-ascii-scramble>{{ include.title | escape }}</span></h2>
</header>
