{%- comment -%}
  Cosmos のタイル。対応するパネル（id）へのページ内リンクなので、JS が無くても目次として働く。
  引数: id、title、accent、icon（_includes/cosmos-icon.html の名前）または image / alt
{%- endcomment -%}
<a class="console-tile{% if include.image %} console-tile--art{% endif %}" href="#{{ include.id | escape }}" id="tile-{{ include.id | escape }}" data-console-tile="{{ include.id | escape }}" style="--accent: {{ include.accent }}">
  <span class="console-tile-face">
    {%- if include.image %}
    <img src="{{ include.image | relative_url }}" alt="" width="160" height="160" loading="lazy" decoding="async">
    {%- else %}
    {% include cosmos-icon.html name=include.icon %}
    {%- endif %}
  </span>
  <span class="console-tile-label">{{ include.title | escape }}</span>
</a>
