<footer class="site-footer h-card">
  {%- assign home_url = '/' -%}
  {%- if page.lang == 'en' -%}{%- assign home_url = '/en/' -%}{%- endif %}
  <data class="u-url" value="{{ home_url | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
        <ul class="contact-list">
          <li class="p-name no-select">Kanade Nonomura</li>
          {% if site.email %}
            <li class="no-select">{{ site.email }}</li>
          {% endif %}
        </ul>
      </div>
    </div>

    <div class="social-links">
      {%- include social.html -%}
    </div>

  </div>

</footer>
