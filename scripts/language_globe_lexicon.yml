# ==================================================
# Language Globe の多言語対応表（手動で整える）
# ==================================================
# scripts/generate_language_globe.py が、TF-IDF で選ばれた語にこの表を結び付けて
# _data/language_globe.json を作る。ここに無い語も Globe には載る（ホバー時は共起語だけを出す）。
# 単語の選定は TF-IDF 側で行うため、ここに語を足しても Globe の語は増えない。
#
# 見出し語: TF-IDF の出力どおりに書く（英字は小文字で照合する）
#   variants: 言語コード → 表記（複数あればリスト）。ホバーで周囲に広がる。先頭 5 件まで
#   concepts: 近い概念・言い換え。先頭 3 件まで
#   category: 自動判定（その語の重みが付いたセクション）を上書きしたいときだけ書く
#
# 翻訳の厳密さより、ポートフォリオとして意味が伝わることを優先している。

